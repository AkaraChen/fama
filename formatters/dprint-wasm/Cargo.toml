[package]
name = "fama-dprint-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fama_dprint_wasm"
crate-type = ["rlib"]

[dependencies]
fama-common = { path = "../../common" }
fama-wasm = { path = "../wasm-runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
wasmtime = "51.0.0"

[dev-dependencies]
fama-builtin = { path = "../builtin" }
fama-clang = { path = "../clang" }
fama-web = { path = "../web" }
goffi = { path = "../goffi" }
tempfile = "3.14"
