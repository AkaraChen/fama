# Markdown, YAML, CSS/SCSS/LESS/Sass, JSON5, Jupyter, Web Templates
dprint-plugin-markdown = "0.20"
dprint-core = "0.67"
dprint-core-json = { package = "dprint-core", version = "0.75" }
dprint-plugin-json = "0.26"
dprint-plugin-jupyter = "0.6"
pretty_yaml = "0.6"
anyhow = "1.0"
malva = "0.10"
markup_fmt = "0.28.0"
