[package]
name = "fama-builtin"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fama_builtin"
crate-type = ["rlib"]

[dependencies]
fama-common = { path = "../../common" }

# Dockerfile
dprint-core-dockerfile = { package = "dprint-core", version = "0.65" }
dprint-plugin-dockerfile = { git = "https://github.com/dprint/dprint-plugin-dockerfile.git", rev = "c20fd3ee7851e1c0263c0b04322303ac24373e52" }

# TOML
taplo = "0.14"

# Python
ruff_python_formatter = { git = "https://github.com/astral-sh/ruff.git", rev = "8d4d782e16b126d89a2a6d43bdcaa5450d67b804" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", rev = "8d4d782e16b126d89a2a6d43bdcaa5450d67b804" }
ruff_formatter = { git = "https://github.com/astral-sh/ruff.git", rev = "8d4d782e16b126d89a2a6d43bdcaa5450d67b804" }

# Lua
stylua = "0.20"

# XML
quick-xml = "0.37"

# SQL
sqruff-lib = "0.34"
sqruff-lib-core = "0.34"
sqruff-lib-dialects = "0.34"
ahash = "0.8"

# PHP
mago-formatter = "0.26"
mago-php-version = "0.26"
mago-interner = "0.26"

# CMake
cmakefmt-rust = { version = "2", default-features = false }

# Nix
alejandra = "3.1.0"

# WGSL
wgsl-formatter = { git = "https://github.com/wgsl-analyzer/wgsl-analyzer.git", rev = "963ec16ba47e33a99e613ef6231f6d8dff72ab63" }
wgsl-syntax = { git = "https://github.com/wgsl-analyzer/wgsl-analyzer.git", rev = "963ec16ba47e33a99e613ef6231f6d8dff72ab63", package = "syntax" }

# Typst
typstyle-core = "0.15.3"

# KDL
kdl = { version = "6.7.1", default-features = false, features = ["span"] }

# GDScript
gdck-format = "0.8.0"
gdck-config = "0.8.0"

# LaTeX
tex-fmt = "0.5.7"
