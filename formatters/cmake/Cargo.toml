[package]
name = "fama-cmake"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cmake_fmt"
crate-type = [ "rlib" ]

[dependencies]
fama-common = { path = "../../common" }
# Library-only use: `format_source` needs no CLI deps (clap, walkdir, rayon, …)
cmakefmt-rust = { version = "2", default-features = false }
