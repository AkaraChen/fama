# GraalVM native-image configuration for ktfmt-worker.
#
# These initialization rules are vendored from ktfmt v0.65's own native image
# build (core/src/main/native-image/initialize-at-*.txt), which the ktfmt
# project uses for its official native binaries. Initialize the whole ktfmt
# package at build time for startup speed, except the two classes listed for
# run time, whose <clinit> builds run-time-only object graphs.
Args = --initialize-at-build-time=com.google.common.collect.SingletonImmutableList
Args = --initialize-at-build-time=com.google.googlejavaformat.Indent$Const
Args = --initialize-at-build-time=kotlin.Function
Args = --initialize-at-build-time=kotlin.KotlinVersion
Args = --initialize-at-build-time=kotlin.SynchronizedLazyImpl
Args = --initialize-at-build-time=kotlin.UNINITIALIZED_VALUE
Args = --initialize-at-build-time=kotlin.collections.AbstractList$Companion
Args = --initialize-at-build-time=kotlin.collections.EmptyMap
Args = --initialize-at-build-time=kotlin.enums.EnumEntriesList
Args = --initialize-at-build-time=kotlin.jvm.functions.Function1
Args = --initialize-at-build-time=kotlin.text.Regex
Args = --initialize-at-build-time=org.jetbrains.kotlinx.ktfmt
Args = --initialize-at-run-time=org.jetbrains.kotlinx.ktfmt.cli.EditorConfigResolver
Args = --initialize-at-run-time=org.jetbrains.kotlinx.ktfmt.util.CompatibilityUtilsKt
Args = --initialize-at-run-time=kotlin.random.AbstractPlatformRandom
Args = --initialize-at-run-time=kotlin.random.Random
Args = --initialize-at-run-time=kotlin.random.Random$Default
Args = --initialize-at-run-time=kotlin.random.RandomKt
Args = --initialize-at-run-time=kotlin.random.XorWowRandom
Args = --initialize-at-run-time=kotlin.random.jdk8.PlatformThreadLocalRandom
Args = --initialize-at-run-time=kotlin.uuid.SecureRandomHolder
