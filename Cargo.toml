[workspace]
members = [
	"cli",
	"common",
	"formatters/biome",
	"formatters/clang",
	"formatters/dprint",
	"formatters/toml",
	"formatters/rustfmt",
	"formatters/python",
	"formatters/lua",
	"formatters/goffi",
	"formatters/zigffi",
	"formatters/dockerfile",
	"formatters/sqruff",
	"formatters/xml",
	"formatters/ruby",
	"formatters/php",
	"formatters/process",
]
resolver = "2"

[workspace.dependencies]
# For workspace members that reference each other, use path dependencies

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Cranelift compiling the embedded clang-format.wasm is unbearably slow at
# opt-level 0; optimize the wasmtime/cranelift stack in dev and test builds
# too. fama's own crates stay at opt-level 0 for fast iteration.
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime-internal-core]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-bitset]
opt-level = 3
[profile.dev.package.cranelift-control]
opt-level = 3
[profile.dev.package.cranelift-native]
opt-level = 3
[profile.dev.package.cranelift-isle]
opt-level = 3
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3
