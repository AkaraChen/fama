[package]
name = "fama"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fama-common = { path = "../common" }
fama-builtin = { path = "../formatters/builtin" }
fama-web = { path = "../formatters/web" }
fama-process = { path = "../formatters/process" }
fama-clang = { path = "../formatters/clang" }
fama-dart = { path = "../formatters/dart" }
fama-swift = { path = "../formatters/swift" }
goffi = { path = "../formatters/goffi" }
ruby-fmt = { path = "../formatters/ruby" }
fama-kotlin-worker = { path = "../formatters/kotlin-worker" }
fama-topiary = { path = "../formatters/topiary" }
fama-dprint-wasm = { path = "../formatters/dprint-wasm" }
ignore = "0.4"
glob = "0.3"
clap = { version = "4.5", features = [ "derive" ] }
anyhow = "1.0"
rayon = "1.11"
pathdiff = "0.2"
linguist = { version = "0.1.18", default-features = false }

[dev-dependencies]
tempfile = "3.14"

[[bin]]
name = "fama"
path = "src/main.rs"
